<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>WebRTC Host</title>
</head>
<body>
<script>
async function runHost(sessionId, sourceId, iceServers, monitors) {
  const pc = new RTCPeerConnection({
    iceServers: (Array.isArray(iceServers) && iceServers.length)
      ? iceServers
      : [{ urls: "stun:stun.l.google.com:19302" }],
  });

  const monitorList = Array.isArray(monitors) && monitors.length ? monitors : [{ id: sourceId, name: "Monitor 1" }];
  let currentSourceId = sourceId;
  let stream = null;
  let videoSender = null;
  let controlChannelRef = null;

  // Captura uma tela específica (com fallback sem constraints mandatórias).
  async function captureScreen(id) {
    try {
      return await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { mandatory: { chromeMediaSource: "desktop", chromeMediaSourceId: id, minWidth: 1280, maxWidth: 4096 } },
      });
    } catch (e) {
      console.error("getUserMedia falhou:", e.message);
      return await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { chromeMediaSource: "desktop", chromeMediaSourceId: id },
      });
    }
  }

  // Informa ao viewer quais monitores existem e qual está ativo (para mostrar o seletor).
  function sendMonitors() {
    if (controlChannelRef && controlChannelRef.readyState === "open") {
      controlChannelRef.send(JSON.stringify({ type: "monitors", list: monitorList, active: currentSourceId }));
    }
  }

  // Alterna a tela transmitida sem renegociar: troca o track no mesmo sender (replaceTrack).
  async function switchMonitor(id) {
    if (id === currentSourceId || !monitorList.some((m) => m.id === id)) return;
    const newStream = await captureScreen(id);
    const newTrack = newStream.getVideoTracks()[0];
    if (!videoSender || !newTrack) return;
    await videoSender.replaceTrack(newTrack);
    try { stream.getTracks().forEach((t) => t.stop()); } catch { /* ignore */ }
    stream = newStream;
    currentSourceId = id;
    console.log("Monitor alternado para", id);
    sendMonitors();
  }

  stream = await captureScreen(sourceId);
  const videoTrack = stream.getVideoTracks()[0];
  console.log("Tracks capturadas:", stream.getTracks().length);
  videoSender = pc.addTrack(videoTrack, stream);

  // DataChannel de controle (mouse, teclado, arquivos, troca de monitor): o VIEWER (offerer)
  // cria o canal e o host (answerer) apenas ESCUTA — padrão canônico e confiável de WebRTC.
  pc.ondatachannel = (event) => {
    const controlChannel = event.channel;
    controlChannelRef = controlChannel;
    controlChannel.onopen = () => { console.log("DataChannel 'control' aberto"); sendMonitors(); };
    controlChannel.onclose = () => console.log("DataChannel 'control' fechado");
    controlChannel.onmessage = (msg) => handleControlMessage(msg.data);
  };

  function handleControlMessage(raw) {
    try {
      const msg = JSON.parse(raw);
      if (msg.type === "switch_monitor") {
        switchMonitor(msg.id).catch((e) => console.error("Falha ao trocar monitor:", e.message));
      } else if (msg.type === "mouse_move") {
        window.webrtcBridge.simulateInput("mouse_move", { x: msg.x, y: msg.y, screenW: msg.screenW, screenH: msg.screenH });
      } else if (msg.type === "mouse_down") {
        window.webrtcBridge.simulateInput("mouse_down", { button: msg.button });
      } else if (msg.type === "mouse_up") {
        window.webrtcBridge.simulateInput("mouse_up", { button: msg.button });
      } else if (msg.type === "mouse_wheel") {
        window.webrtcBridge.simulateInput("mouse_wheel", { delta: msg.delta });
      } else if (msg.type === "key_down") {
        window.webrtcBridge.simulateInput("key_down", { key: msg.key, code: msg.code });
      } else if (msg.type === "key_up") {
        window.webrtcBridge.simulateInput("key_up", { key: msg.key, code: msg.code });
      } else if (msg.type === "type_text") {
        window.webrtcBridge.simulateInput("type_text", { text: msg.text });
      } else if (msg.type === "file_upload") {
        window.webrtcBridge.saveFile(msg.name, msg.data)
          .then(() => console.log("Arquivo salvo:", msg.name))
          .catch((e) => console.error("Falha ao salvar arquivo:", e));
      }
    } catch { /* ignore malformed */ }
  }

  let lastSignalAt = "";
  let polling = false;
  let offerReceived = false;

  pc.onicecandidate = async (event) => {
    if (!event.candidate) return;
    await window.webrtcBridge.postSignal(sessionId, { type: "ice", candidate: event.candidate });
  };

  async function pollViewer() {
    if (polling) return;
    polling = true;
    try {
      const signals = await window.webrtcBridge.pollSignals(sessionId, lastSignalAt);
      for (const signal of signals || []) {
        lastSignalAt = signal.createdAt;
        const payload = signal.payload || {};
        if (payload.type === "offer" && payload.sdp) {
          if (offerReceived || pc.signalingState !== "stable") continue;
          offerReceived = true;
          console.log("Oferta recebida, criando resposta...");
          await pc.setRemoteDescription({ type: "offer", sdp: payload.sdp });
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          await window.webrtcBridge.postSignal(sessionId, { type: "answer", sdp: answer.sdp });
          console.log("Resposta enviada, aguardando ICE...");
        } else if (payload.type === "ice" && payload.candidate) {
          try { await pc.addIceCandidate(payload.candidate); } catch { /* ignore */ }
        }
      }
    } finally {
      polling = false;
    }
  }

  setInterval(pollViewer, 1200);
  await pollViewer();
}

window.webrtcBridge.onConfig((config) => {
  runHost(config.sessionId, config.sourceId, config.iceServers, config.monitors).catch(console.error);
});
</script>
</body>
</html>
